<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет приложения ТСЖ — ознакомление</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--panel2:#273549;--ink:#e2e8f0;--muted:#94a3b8;--line:#334155;--accent:#38bdf8;--down:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  html,body{height:100%}
  .gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .gate-card{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .gate-card h2{margin:0 0 6px;font-size:22px}
  .gl{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .gate-opts{display:flex;flex-direction:column;gap:12px;margin:18px 0}
  .gate-opt{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
  .gate-opt input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent);cursor:pointer}
  .gt{font-size:14px;font-weight:600}
  .gd{font-size:12.5px;color:var(--muted);margin-top:2px}
  .gate-err{color:var(--down);font-size:13px;min-height:18px;margin:2px 0 10px}
  .gate-btn{width:100%;background:var(--accent);color:#0f172a;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:14px;cursor:pointer;transition:opacity .2s}
  .gate-btn:disabled{opacity:.45;cursor:not-allowed}
  .gate-note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
  #frameWrap{position:fixed;inset:0;display:none}
  #frameWrap iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div class="gate" id="gateScreen" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-card">
    <h2 id="gateTitle">Ознакомьтесь перед просмотром макета</h2>
    <p class="gl">Макет — это демонстрация, как может выглядеть приложение ТСЖ. Отметьте, что вам понятен его статус, и подтвердите.</p>
    <div class="gate-opts">
      <label class="gate-opt"><input type="checkbox" class="greq"><span><span class="gt">Это интерактивный макет (прототип), а не готовый программный продукт.</span> <span class="gd">Экраны работают на демо-данных; ничего не сохраняется и не отправляется.</span></span></label>
      <label class="gate-opt"><input type="checkbox" class="greq"><span><span class="gt">Макет не является аудитом, бухгалтерским или юридическим заключением.</span> <span class="gd">Он показывает возможный состав функций системы для обсуждения.</span></span></label>
      <label class="gate-opt"><input type="checkbox" class="greq"><span><span class="gt">Я понимаю, что макет может содержать вымышленные показатели и примеры.</span> <span class="gd">Данные демонстрационные и не отражают реальные счета дома.</span></span></label>
      <label class="gate-opt"><input type="checkbox" class="greq"><span><span class="gt">Я самостоятельно отвечаю за решения, принятые на основе этого материала.</span> <span class="gd">Прототип — предмет обсуждения, а не основание для действий без проверки.</span></span></label>
      <label class="gate-opt"><input type="checkbox" class="greq"><span><span class="gt">Мне понятен смысл фразы «это демонстрационный макет, а не готовая система».</span> <span class="gd">Я осознаю границы прототипа.</span></span></label>
    </div>
    <div class="gate-err" id="gateErr"></div>
    <button type="button" class="gate-btn" id="gateBtn" disabled>Я ознакомлен(а) и подтверждаю</button>
    <p class="gate-note">Макет откроется только после отметки всех пунктов и нажатия кнопки.</p>
  </div>
</div>
<div id="frameWrap"><iframe src="tsj-mockup-v2.html" title="Макет приложения ТСЖ"></iframe></div>

<script>
(function(){
  var screen=document.getElementById('gateScreen');
  var btn=document.getElementById('gateBtn');
  var err=document.getElementById('gateErr');
  var wrap=document.getElementById('frameWrap');
  var boxes=[].slice.call(document.querySelectorAll('.greq'));
  function refresh(){var ok=boxes.every(function(b){return b.checked;});btn.disabled=!ok;if(ok)err.textContent='';}
  boxes.forEach(function(b){b.addEventListener('change',refresh);});
  btn.addEventListener('click',function(){
    if(btn.disabled){err.textContent='Отметьте все обязательные пункты перед подтверждением.';return;}
    screen.style.display='none';
    wrap.style.display='block';
    document.body.style.overflow='hidden';
  });
})();
</script>
</body>
</html>
